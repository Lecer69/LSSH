name: Publish to AUR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set pkgver and pkgrel
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a version tag, not the branch '$GITHUB_REF_NAME'"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

          # A new version starts at pkgrel 1; re-publishing a version that is
          # already on the AUR bumps pkgrel so AUR users get the update.
          aur="$(curl -fsS 'https://aur.archlinux.org/rpc/v5/info?arg[]=lssh' | jq -r '.results[0].Version // empty')"
          if [ "${aur%-*}" = "$version" ]; then
            pkgrel=$(( ${aur##*-} + 1 ))
          else
            pkgrel=1
          fi
          echo "AUR has: ${aur:-nothing}, publishing: $version-$pkgrel"

          sed -i \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e "s/^pkgrel=.*/pkgrel=$pkgrel/" \
            PKGBUILD
          grep -E '^(pkgver|pkgrel)=' PKGBUILD

      - name: Build, update checksums and push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: lssh
          pkgbuild: ./PKGBUILD
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
